<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('hideaway-theme');
        if (stored === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.remove('light');
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Gents Dollhouse · Creator Platform</title>
  <meta name="description"
    content="The premium subscription platform for African creators. Monetize your audience directly through M-Pesa, cards & more. No middleman. No hassle." />
  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="The Gents Dollhouse · Creator Platform" />
  <meta property="og:description"
    content="The premium subscription platform for African creators. Monetize your audience directly through M-Pesa, cards & more." />
  <meta property="og:image" content="/logo.svg" />
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="The Gents Dollhouse · Creator Platform" />
  <meta name="twitter:description"
    content="The premium subscription platform for African creators. Monetize your audience directly through M-Pesa." />
  <!-- PWA Manifest & App Capability -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#E11D48" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gents Dollhouse" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
</head>

<body>
  <div id="root"></div>
  <script src="https://js.paystack.co/v1/inline.js" async></script>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.warn('Service worker registration note:', err);
        });
      });
    }
  </script>
</body>

</html>
